name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run smoke tests
        run: npm run smoke

      - name: Run blueprint regression tests
        run: npm run test:blueprint

      - name: Run unit tests
        run: npm run test:unit

      - name: Build dist package
        run: npm run build

      - name: Verify dist assets
        run: npm run verify:dist

      - name: Run integration tests
        run: npm run test:integration

      - name: CI Check Summary
        if: always()
        run: |
          echo "## CI Check Results" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Format: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Blueprint regression: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Build dist: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Verify dist: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Integration tests: Completed" >> $GITHUB_STEP_SUMMARY
