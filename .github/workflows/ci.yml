name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check lint warning baseline
        run: npm run lint:baseline

      - name: Check formatting
        run: npm run format:check

      - name: Run smoke tests
        run: npm run smoke

      - name: Run blueprint regression tests
        run: npm run test:blueprint

      - name: Run unit tests
        run: npm run test:unit

      - name: Validate monitor baseline
        run: npm run monitor:check

      - name: Validate business metrics baseline
        run: npm run metrics:check

      - name: Build dist-vite package
        run: npm run build

      - name: Verify dist-vite assets
        run: npm run verify:vite-dist

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run browser E2E tests
        run: npm run test:e2e

      - name: Run accessibility audit
        run: npm run test:a11y

      - name: Run integration tests
        run: npm run test:integration

      - name: CI Check Summary
        if: always()
        run: |
          echo "## CI Check Results" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Lint baseline: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Format: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Blueprint regression: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor baseline: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Metrics baseline: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Build dist-vite: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Verify dist-vite: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Browser E2E: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Accessibility audit: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Integration tests: Completed" >> $GITHUB_STEP_SUMMARY
