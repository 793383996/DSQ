services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dsq-calculator
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health.json"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=10m,mode=1777
      - /var/log/nginx:size=5m,mode=1777
      - /var/run:size=1m,mode=1777
      - /tmp:size=1m,mode=1777
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - frontend
    stop_grace_period: 10s
    stop_signal: SIGQUIT

  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: dsq-calculator-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - TZ=Asia/Shanghai
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    profiles:
      - dev
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

networks:
  frontend:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
