services:
  dsq-calculator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dsq-calculator
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  dsq-calculator-dev:
    image: node:20-alpine
    container_name: dsq-calculator-dev
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev

volumes:
  node_modules:
