<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <circle cx="100" cy="100" r="150" fill="#0f3460" opacity="0.3"/>
  <circle cx="1100" cy="530" r="200" fill="#e94560" opacity="0.1"/>
  <circle cx="600" cy="315" r="250" fill="#16213e" opacity="0.5"/>
  
  <g transform="translate(600, 180)">
    <polygon points="0,-60 52,30 -52,30" fill="url(#accent-gradient)" filter="url(#glow)"/>
    <polygon points="0,-45 39,22 -39,22" fill="#1a1a2e"/>
    <circle cx="0" cy="0" r="15" fill="#ffd700"/>
  </g>
  
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">
    戴森球计划
  </text>
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="42" fill="#e94560" text-anchor="middle">
    量产量化计算器
  </text>
  
  <text x="600" y="460" font-family="Arial, sans-serif" font-size="24" fill="#a0a0a0" text-anchor="middle">
    自动计算量产需求 · 蓝图生成 · 生产链优化
  </text>
  
  <rect x="450" y="500" width="300" height="50" rx="25" fill="url(#accent-gradient)"/>
  <text x="600" y="533" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">
    dsp-calculator.example.com
  </text>
  
  <g transform="translate(150, 500)">
    <rect x="0" y="0" width="40" height="30" rx="3" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
    <rect x="5" y="5" width="30" height="20" fill="#1a202c"/>
    <circle cx="20" cy="15" r="5" fill="#48bb78"/>
  </g>
  
  <g transform="translate(950, 480)">
    <rect x="0" y="0" width="80" height="60" rx="5" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
    <rect x="5" y="5" width="70" height="40" fill="#1a202c"/>
    <rect x="10" y="50" width="60" height="5" rx="2" fill="#4a5568"/>
  </g>
</svg>
