<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请求过于频繁</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
        }
        .container { 
            text-align: center; 
            padding: 40px 60px; 
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .error-code {
            font-size: 72px;
            font-weight: 700;
            color: #f39c12;
            margin-bottom: 16px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        h1 { 
            font-size: 24px;
            color: #fff; 
            margin-bottom: 16px;
            font-weight: 500;
        }
        p { 
            color: rgba(255, 255, 255, 0.7); 
            margin-bottom: 24px;
            line-height: 1.6;
        }
        button { 
            padding: 12px 32px; 
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚠️</div>
        <div class="error-code">429</div>
        <h1>请求过于频繁</h1>
        <p>您的请求速度过快，请稍后再试<br><small id="retry-after"></small></p>
        <button onclick="location.reload()">刷新页面</button>
    </div>
    <script>
        (function() {
            var retryAfter = document.querySelector('meta[http-equiv="retry-after"]');
            if (retryAfter) {
                var retryText = retryAfter.getAttribute('content');
                document.getElementById('retry-after').textContent = '请在 ' + retryText + ' 后重试';
            }
        })();
    </script>
</body>
</html>
